[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "price-platform"
version = "0.1.0"
description = "Kubernetes-native RPA price monitoring platform (graduation project)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "aiohttp>=3.9",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "croniter>=3.0",
    "PyYAML>=6.0",
    "selectolax>=0.3.21",
    "httpx>=0.27",
]

[project.optional-dependencies]
worker = ["playwright>=1.47"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
price-api = "price_platform.api.main:run"
price-scheduler = "price_platform.scheduler.main:run"
price-worker = "price_platform.worker.main:run"
price-reaper = "price_platform.reaper.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs Postgres/Redis (docker compose)",
    "e2e: needs the full stack running",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
