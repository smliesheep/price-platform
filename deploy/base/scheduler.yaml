apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: price
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: scheduler }
  template:
    metadata:
      labels: { app: scheduler }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: scheduler
          image: price/api:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "price_platform.scheduler.main"]
          envFrom:
            - configMapRef: { name: price-config }
            - secretRef:    { name: price-secret }
          env:
            - { name: PP_POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          ports:
            - { name: metrics, containerPort: 9100 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /-/healthy, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: metrics }
            initialDelaySeconds: 20
            periodSeconds: 20
