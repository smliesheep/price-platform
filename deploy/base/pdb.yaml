apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
  namespace: price
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: worker }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: price
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api }
