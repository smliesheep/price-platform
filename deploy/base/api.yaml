apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: price
  labels: { app: api }
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: price
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: api
          image: price/api:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "price_platform.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
          envFrom:
            - configMapRef: { name: price-config }
            - secretRef:    { name: price-secret }
          env:
            - { name: PP_POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: PP_NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
          ports:
            - { name: http, containerPort: 8000 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop: { exec: { command: ["sh", "-c", "sleep 5"] } }
