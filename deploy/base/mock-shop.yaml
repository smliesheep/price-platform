apiVersion: v1
kind: Service
metadata:
  name: mock-shop
  namespace: price
  labels: { app: mock-shop }
spec:
  selector: { app: mock-shop }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-shop
  namespace: price
spec:
  replicas: 1
  selector:
    matchLabels: { app: mock-shop }
  template:
    metadata:
      labels: { app: mock-shop }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: mock-shop
          image: price/mock-shop:v1
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: FAIL_RATE, value: "0" }
            - { name: DELAY_MS, value: "0" }
            - { name: TZ, value: Asia/Shanghai }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
