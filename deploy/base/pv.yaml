# k3d 演示集群没有可用的动态存储（local-path provisioner 镜像拉取受限），
# 用 hostPath 静态 PV 顶替：数据在节点容器内持久，集群重建则丢弃。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
spec:
  capacity: { storage: 10Gi }
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/rancher/price/postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [k3d-price-agent-1] }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-pv
spec:
  capacity: { storage: 5Gi }
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/rancher/price/redis
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [k3d-price-agent-0] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: price
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  volumeName: postgres-pv
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: price
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  volumeName: redis-pv
  resources:
    requests:
      storage: 5Gi
